[package]
name = "simeis-server"
version = "0.1.4"
edition = "2026"

[dependencies]
simeis-data = { path = "../simeis-data" }
urlencoding = "2.1.3"
ntex = { version = "3.9.8", features = ["compress"], default-features = false }
# Aligné sur ntex-rt (compio-runtime 0.11). Éviter compio = "*" qui tire la 0.19+.
compio-runtime = { version = "0.11", optional = true }
tokio = { version = "*", features = ["rt-multi-thread"], optional = true }

base64 = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
mea = { workspace = true }

[features]
default = ["compio"]
testing = ["simeis-data/testing"]
# Feature dédiée aux jobs CI lourds (placeholder pour futurs tests avancés).
heavy-testing = ["testing", "simeis-data/heavy-testing"]
extraspeed = ["simeis-data/extraspeed"]

# Async runtimes
compio = [ "ntex/compio", "dep:compio-runtime" ]
tokio = [ "ntex/tokio", "dep:tokio" ]

[profile.release]
opt-level = 3
strip = "symbols"
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 8
