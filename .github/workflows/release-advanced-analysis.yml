name: Release Advanced Analysis

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  advanced-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain and components
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup toolchain install nightly --profile minimal

      - name: Run unit tests with heavy-testing feature
        run: cargo test --workspace --features heavy-testing

      - name: Build debug binaries with heavy-testing feature
        run: cargo build --workspace --features heavy-testing

      - name: Run heavy property-based tests
        run: python tests/propertybased.py --heavy

      - name: Run functional user scenarios
        run: make functional-test

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Audit dependencies for vulnerabilities
        run: cargo audit

      - name: Install cargo-udeps
        run: cargo install --locked cargo-udeps

      - name: Check unused dependencies
        run: cargo +nightly udeps --workspace --all-targets
