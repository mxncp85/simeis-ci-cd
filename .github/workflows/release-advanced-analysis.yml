name: Release Advanced Analysis

on:
  push:
    branches:
      - "release/**"

concurrency:
  group: release-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-heavy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: heavy-testing

      - name: Run unit tests with heavy-testing feature
        run: cargo test --workspace --features heavy-testing

      - name: Build server for functional tests
        run: cargo build -p simeis-server --features heavy-testing

      - name: Run functional user scenarios
        env:
          SIMEIS_SKIP_BUILD: "1"
        run: make functional-test

  property-heavy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run heavy property-based tests
        run: python tests/propertybased.py --heavy

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust stable
        uses: ./.github/actions/setup-rust

      - name: Install nightly toolchain
        shell: bash
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-audit
        uses: ./.github/actions/install-cargo-tool
        with:
          crate: cargo-audit
          version: v0.21.2

      - name: Install cargo-udeps
        uses: ./.github/actions/install-cargo-tool
        with:
          crate: cargo-udeps
          version: v0.1.57

      - name: Audit dependencies for vulnerabilities
        run: cargo audit

      - name: Check unused dependencies
        run: cargo +nightly udeps --workspace --all-targets
