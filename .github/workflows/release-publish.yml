# Pipeline de publication : build des artefacts, release GitHub, déploiement SSH sur la VM.
# S'enchaîne après Release Advanced Analysis (tests lourds verts sur release/x.y.z).
name: Release Publish

on:
  # Déclenché automatiquement quand "Release Advanced Analysis" se termine.
  workflow_run:
    workflows: ["Release Advanced Analysis"]
    types: [completed]

  # Relance manuelle possible (ex. republier sans nouveau merge).
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Branche release (ex: release/0.1.3)"
        required: true
        type: string

permissions:
  contents: write  # créer/mettre à jour la release et uploader les fichiers

jobs:
  publish-release:
    # Mode manuel : toujours. Mode auto : uniquement si les tests lourds ont réussi sur release/*.
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'release/'))
    runs-on: ubuntu-latest
    steps:
      # Récupère le SHA de la branche release (workflow_run) ou la branche saisie (dispatch).
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_branch || github.event.workflow_run.head_sha }}
          fetch-depth: 0  # historique complet pour le changelog (PRs mergées)

      # Extrait version, tag, noms de fichiers deb/docker à partir de release/x.y.z.
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.event.inputs.release_branch }}"
          else
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          fi

          if [[ ! "$BRANCH" =~ ^release/ ]]; then
            echo "Branche invalide: $BRANCH (attendu: release/x)"
            exit 1
          fi

          # release/0.1.4 -> version 0.1.4, tag v0.1.4
          VERSION="${BRANCH#release/}"
          PKG_NAME="simeis-ci-cd"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "deb=build/deb/${PKG_NAME}_${VERSION}-1_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "docker_image=simeis-server:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "docker_tar=simeis-server-${VERSION}-docker-image.tar" >> "$GITHUB_OUTPUT"
          echo "deploy_port=9450" >> "$GITHUB_OUTPUT"

      # --- Build des artefacts ---
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-${{ steps.meta.outputs.version }}

      # Typst compile doc/manual.pdf (inclus dans make ci-release).
      - name: Install Typst compiler
        uses: ./.github/actions/install-cargo-tool
        with:
          crate: typst-cli
          bin: typst
          version: v0.13.1

      # Binaire release, swagger.json, manuel PDF, etc.
      - name: Build release artefacts
        run: make ci-release

      # Paquet .deb installable via apt sur la VM (systemd + dépendances).
      - name: Build Debian package
        shell: bash
        env:
          PKG_NAME: ${{ steps.meta.outputs.pkg_name }}
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh "${{ steps.meta.outputs.version }}" amd64

      # Renomme le SDK Python pour l'attacher à la release GitHub.
      - name: Prepare SDK artefact
        shell: bash
        run: cp sdk/python.py simeis-sdk-python.py

      # Image Docker multi-étapes (.github/dockerfile) avec le binaire compilé ci-dessus.
      - name: Build Docker image
        shell: bash
        run: |
          docker build \
            -f .github/dockerfile \
            -t "${{ steps.meta.outputs.docker_image }}" \
            .

      # Archive .tar de l'image pour téléchargement depuis la release (docker load).
      - name: Export Docker image archive
        shell: bash
        run: |
          docker image save \
            "${{ steps.meta.outputs.docker_image }}" \
            -o "${{ steps.meta.outputs.docker_tar }}"

      # Changelog auto : PRs mergées dans la branche release, classées Features/Bugfix/Autre.
      - name: Generate changelog from merged PRs
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ steps.meta.outputs.branch }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          OUTPUT_PATH: release-notes.md
        shell: bash
        run: |
          python .github/scripts/generate_release_changelog.py
          # Passe le markdown au step suivant via GITHUB_OUTPUT.
          {
            echo "body<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Crée ou met à jour la release GitHub (tag vX.Y.Z) et uploade tous les artefacts.
      - name: Create or update GitHub Release
        uses: docker://ghcr.io/mini-bomba/create-github-release:v1.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.meta.outputs.tag }}
          name: Simeis ${{ steps.meta.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          target_commit: ${{ steps.meta.outputs.branch }}
          clear_attachments: true  # remplace les assets si la release existe déjà
          files: |
            target/release/simeis-server
            ${{ steps.meta.outputs.deb }}
            doc/manual.pdf
            doc/swagger.json
            simeis-sdk-python.py
            ${{ steps.meta.outputs.docker_tar }}

      # --- Déploiement continu (optionnel si DEPLOY_SSH_HOST est configuré) ---
      # Variables repo : DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_SSH_PORT
      # Secret repo    : DEPLOY_SSH_PRIVATE_KEY
      - name: Deploy release on remote VM
        if: vars.DEPLOY_SSH_HOST != ''
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SERVER_PORT: ${{ steps.meta.outputs.deploy_port }}
          DEB_PATH: ${{ steps.meta.outputs.deb }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          PKG_NAME: ${{ steps.meta.outputs.pkg_name }}
        run: |
          chmod +x .github/scripts/deploy_vm.sh
          .github/scripts/deploy_vm.sh

      # Vérifie que curl http://hostname:9450/version renvoie la bonne version.
      - name: Verify remote server version
        if: vars.DEPLOY_SSH_HOST != ''
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SERVER_PORT: ${{ steps.meta.outputs.deploy_port }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          chmod +x .github/scripts/verify_deploy.sh
          .github/scripts/verify_deploy.sh
