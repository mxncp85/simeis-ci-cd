name: PR Quality Checks

on:
  pull_request:
    branches:
      - "**"
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain and components
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy rustfmt

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install Python formatter
        run: python -m pip install --upgrade pip black

      - name: Check Python formatting (files used for tests)
        shell: bash
        run: |
          FILES=$(git ls-files '*.py' | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "Aucun fichier Python à vérifier."
            exit 0
          fi
          python -m black --check $FILES

  review-required:
    name: review-required
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Ensure at least one approved review exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          APPROVAL_COUNT=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.state == "APPROVED")] | length')

          if [ "$APPROVAL_COUNT" -lt 1 ]; then
            echo "Cette PR doit avoir au moins une review approuvée."
            exit 1
          fi
