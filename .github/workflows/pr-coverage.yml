# Mesure la couverture de code sur chaque PR et pose/retire un label si < 50 %.
name: PR Code Coverage

# Déclencheurs : toute PR (vers n'importe quelle branche), à l'ouverture,
# à chaque nouveau commit, à la réouverture ou quand la PR passe en "ready for review".
on:
  pull_request:
    branches:
      - "**"
    types: [opened, synchronize, reopened, ready_for_review]

# Un seul run par PR : un nouveau push annule le run précédent.
concurrency:
  group: pr-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # nécessaire pour ajouter/retirer des labels via gh pr edit

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      # Récupère le code de la branche de la PR.
      - name: Checkout repository
        uses: actions/checkout@v6

      # Installe Rust + met en cache les dépendances Cargo.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # Installe cargo-tarpaulin (outil de mesure de couverture pour Rust).
      - name: Install cargo-tarpaulin
        uses: ./.github/actions/install-cargo-tool
        with:
          crate: cargo-tarpaulin
          version: v0.32.8

      # Lance tarpaulin sur tout le workspace et extrait le pourcentage global.
      - name: Measure workspace coverage
        id: tarpaulin
        shell: bash
        run: |
          set -euo pipefail
          # --workspace : tous les crates ; --ignore-tests : exclut le code des tests eux-mêmes.
          OUTPUT=$(cargo tarpaulin --workspace --ignore-tests 2>&1 | tee tarpaulin.log)
          # Récupère le dernier pourcentage affiché par tarpaulin (ex. "42.35%").
          PERCENT=$(echo "$OUTPUT" | grep -Eo '[0-9]+\.[0-9]+%' | tail -1 | tr -d '%')
          if [ -z "$PERCENT" ]; then
            echo "Impossible d'extraire le pourcentage de coverage."
            exit 1
          fi
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"
          echo "Coverage totale: ${PERCENT}%"

      # Si la couverture est insuffisante, signale la PR avec un label visible.
      - name: Add label when coverage is below 50%
        if: ${{ steps.tarpaulin.outputs.percent < 50 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "not enough tests"

      # Si la couverture repasse au-dessus du seuil, retire le label (|| true : ignore si absent).
      - name: Remove label when coverage is sufficient
        if: ${{ steps.tarpaulin.outputs.percent >= 50 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "not enough tests" || true
