# Workflow de mise à jour automatique des dépendances Rust.
name: Dependency Update

on:
  schedule:
    # Tous les jours à 06:00 UTC (cron : minute heure jour mois jour_semaine).
    - cron: "0 6 * * *"
  # Permet de lancer manuellement depuis l'onglet Actions.
  workflow_dispatch:

# Écriture nécessaire pour pousser une branche et créer/éditer une PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      # Clone complet (fetch-depth: 0 afin de récupérer tous les commits de l'historique git) pour commit/push corrects.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Installe Rust + cache Cargo.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # cargo-edit fournit la commande `cargo upgrade`.
      - name: Install cargo-edit
        uses: ./.github/actions/install-cargo-tool
        with:
          crate: cargo-edit
          version: v0.13.7

      # Met à jour les versions dans les Cargo.toml,
      # puis synchronise le Cargo.lock.
      - name: Update dependencies
        shell: bash
        run: |
          for manifest in \
            ./Cargo.toml \
            ./simeis-data/Cargo.toml \
            ./simeis-server/Cargo.toml; do
            # --incompatible : autorise les mises à jour semver majeures.
            cargo upgrade --incompatible --manifest-path "$manifest"
          done

          cargo update

      # Vérifie si cargo upgrade a modifié des fichiers.
      - name: Detect changes
        id: detect_changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # Crée ou met à jour une PR uniquement s'il y a des changements.
      - name: Create or update pull request
        if: steps.detect_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BRANCH_NAME="bot/deps-update"
          PR_TITLE="chore: update Rust dependencies"

          # Identité Git du bot GitHub Actions pour le commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit sur la branche bot/deps-update et push.
          git checkout -B "$BRANCH_NAME"
          git add -A
          git commit -m "$PR_TITLE" || true
          git push --force-with-lease origin "$BRANCH_NAME"

          # Crée le label bot/update s'il n'existe pas encore.
          gh label create bot/update --color 1d76db --description "Automated dependency update" || true

          # Cherche une PR ouverte existante depuis cette branche.
          PR_NUMBER=$(gh pr list \
            --head "$BRANCH_NAME" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            # Aucune PR ouverte : en crée une nouvelle vers main.
            gh pr create \
              --head "$BRANCH_NAME" \
              --base main \
              --title "$PR_TITLE" \
              --body "MAJ des dépendances avec cargo tools." \
              --label bot/update
          else
            # PR déjà ouverte : met à jour le titre et le label.
            gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --add-label bot/update
          fi
