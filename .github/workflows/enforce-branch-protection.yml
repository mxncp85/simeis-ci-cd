# Workflow pour configurer la protection de la branche main via l'API GitHub.
# À lancer manuellement (workflow_dispatch) par un admin du dépôt.
name: Enforce Branch Protection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect-main:
    runs-on: ubuntu-latest
    steps:
      # Applique les règles de protection sur la branche main.
      - name: Configure branch protection on main
        env:
          # PAT admin (repo + administration) : GITHUB_TOKEN seul ne suffit souvent pas
          # pour modifier les branch protection rules via l'API.
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Règles appliquées sur main :
          # - required_status_checks : les jobs "quality", "review-required" et "check-todos"
          #   doivent passer avant merge ; strict=true exige que la branche soit à jour.
          # - enforce_admins : même les admins respectent ces règles.
          # - required_pull_request_reviews : au moins 1 approbation, reviews périmées invalidées.
          # - allow_force_pushes / allow_deletions : désactivés pour sécuriser main.
          # - required_conversation_resolution : les commentaires de review doivent être résolus.
          cat > protection.json <<'EOF'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["quality", "review-required", "check-todos"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 1
            },
            "restrictions": null,
            "required_linear_history": false,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true
          }
          EOF

          # Envoie la configuration à l'API GitHub (PUT = créer ou remplacer).
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPO}/branches/main/protection" \
            --input protection.json
